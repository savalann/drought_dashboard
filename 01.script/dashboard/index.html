<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streamflow Drought Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">&#9662;</span>
        <span class="brand-name">Streamflow Drought Dashboard</span>
      </div>
      <nav id="tab-bar" class="tab-bar" role="tablist"></nav>
      <div class="topbar-meta">
        <span id="data-source-badge" class="badge">local data</span>
        <span id="generated-at" class="muted"></span>
      </div>
    </header>

    <main id="tab-panels"></main>

    <template id="tpl-map-tab">
      <div class="tab-layout">

        <aside class="sidebar">
          <section class="control-group">
            <h3>Region</h3>
            <label class="field">
              <span>State</span>
              <select data-control="state"></select>
            </label>
          </section>

          <section class="control-group">
            <h3>Severity layer</h3>
            <label class="field">
              <span>Duration (water-years)</span>
              <select data-control="duration"></select>
            </label>
            <label class="field">
              <span>Metric</span>
              <select data-control="metric"></select>
            </label>
            <p class="hint" data-role="metric-hint"></p>
          </section>

          <section class="control-group">
            <h3>Station filters</h3>
            <label class="field">
              <span>GAGES-II status</span>
              <select data-control="reference-status">
                <option value="all">All stations</option>
                <option value="reference">Reference only</option>
                <option value="non-reference">Non-reference only</option>
                <option value="unclassified">Not in GAGES-II</option>
              </select>
            </label>
            <label class="field checkbox">
              <input type="checkbox" data-control="analysis-only" checked />
              <span>Only show stations with drought analysis</span>
            </label>
          </section>

          <section class="control-group" id="legend">
            <h3>Severity magnitude (%)</h3>
            <div id="legend-swatches"></div>
            <p class="hint">Percent below baseline mean flow, at the selected duration &amp; metric. Grey = no analysis for current filters.</p>
          </section>

          <section class="control-group stats">
            <h3>Summary</h3>
            <p><span id="stat-total">0</span> stations shown</p>
            <p><span id="stat-analyzed">0</span> with severity data</p>
          </section>
        </aside>

        <section class="map-area">
          <div id="map" class="map-canvas"></div>
        </section>
      </div>
    </template>

    <template id="tpl-live-analysis-tab">
      <div class="tab-layout">

        <aside class="sidebar">
          <section class="control-group">
            <h3>Region</h3>
            <label class="field">
              <span>State</span>
              <select data-control="state"></select>
            </label>
          </section>

          <section class="control-group">
            <h3>Station filters</h3>
            <label class="field">
              <span>GAGES-II status</span>
              <select data-control="reference-status">
                <option value="all">All stations</option>
                <option value="reference">Reference only</option>
                <option value="non-reference">Non-reference only</option>
                <option value="unclassified">Not in GAGES-II</option>
              </select>
            </label>
            <p class="hint">Only stations with a screened 1940-2026 record (&lt;10% missing) have a Q90 threshold, so this list is shorter than the drought map's.</p>
          </section>

          <section class="control-group">
            <h3>Today / previous days</h3>
            <label class="field">
              <span>Day to show</span>
              <input type="date" id="live-analysis-date" />
            </label>
            <p class="hint" id="live-analysis-date-hint"></p>
            <p id="live-analysis-monitor-error" class="error" hidden></p>
          </section>

          <section class="control-group">
            <h3>10-day prediction</h3>
            <label class="field">
              <span>Model</span>
              <select id="live-analysis-model-select"></select>
            </label>
            <label class="field">
              <span>Forecast issued on</span>
              <input type="date" id="live-analysis-predict-rundate" />
            </label>
            <p class="hint">Defaults to today; falls back to the most recent day that actually has a published run if the exact day picked doesn't.</p>
            <button id="live-analysis-load-predictions" class="btn-detail btn-run">Load prediction</button>
            <p id="live-analysis-predict-progress" class="hint" hidden></p>
            <p id="live-analysis-predict-error" class="error" hidden></p>
            <ul id="live-analysis-predictions-list" class="predictions-list" hidden></ul>
            <div class="warning-banner">
              <strong>Model caveat:</strong> both options here are experimental community NextGen configurations - not
              the official operational National Water Model. Spot-checks found modeled flows on both runs orders of
              magnitude high for at least one station, consistent with a model spin-up transient.
            </div>
          </section>

          <section class="control-group">
            <h3>Status</h3>
            <div id="live-analysis-legend"></div>
          </section>

          <section class="control-group stats">
            <h3>Summary</h3>
            <p id="live-analysis-summary" class="hint"></p>
            <p><span id="live-stat-total">0</span> stations shown</p>
            <p><span id="live-stat-below">0</span> below Q90</p>
          </section>
        </aside>

        <section class="map-area">
          <div id="live-analysis-map" class="map-canvas"></div>
        </section>
      </div>
    </template>

    <template id="tpl-placeholder-tab">
      <div class="placeholder-tab">
        <h2 data-role="title"></h2>
        <p data-role="body"></p>
      </div>
    </template>

  </div>

  <!-- Station detail slide-over -->
  <div id="detail-overlay" class="detail-overlay" hidden></div>
  <aside id="detail-panel" class="detail-panel" hidden>
    <button id="detail-close" class="icon-btn" aria-label="Close">&times;</button>
    <div id="detail-content"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/dataStore.js"></script>
  <script src="js/nwmDataStore.js"></script>
  <script src="js/usgsDataStore.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/map.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/liveAnalysis.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
